[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bank-gateway-tieout-validator"
version = "0.1.0"
description = "Deterministic Python + Pydantic reconciliation validator for bank statements and payment gateway payouts."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.0",
    "pymupdf>=1.24",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
